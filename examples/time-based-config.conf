# Time-based partitioned Redis Streams configuration
input {
  stdin {
    codec => json
  }
}

output {
  redis_streams {
    host => ["127.0.0.1"]
    port => 6379
    stream => "logstash-events"
    
    # Time-based partitioning (hourly streams)
    enable_partitioning => true
    partition_strategy => "time_based"
    time_format => "%Y-%m-%d-%H"
    
    # SSL configuration (optional)
    ssl_enabled => false
    # ssl_certificate => "/path/to/client.crt"
    # ssl_key => "/path/to/client.key"
    # ssl_certificate_authorities => ["/path/to/ca.crt"]
  }
}