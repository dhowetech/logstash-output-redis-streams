# Partitioned Redis Streams configuration with hash-based partitioning
input {
  stdin {
    codec => json
  }
}

output {
  redis_streams {
    host => ["127.0.0.1"]
    port => 6379
    stream => "logstash-events"
    
    # Enable partitioning
    enable_partitioning => true
    partition_strategy => "hash"
    partition_field => "user_id"
    partition_count => 8
    
    # Batching for performance
    batch => true
    batch_events => 100
    batch_timeout => 5
    
    # Stream length management
    maxlen => 10000
    approximate_trimming => true
  }
}