# High-performance Redis Streams configuration with pipelining
input {
  stdin {
    codec => json
  }
}

output {
  redis_streams {
    host => ["127.0.0.1"]
    port => 6379
    stream => "logstash-events"
    
    # Enable batching with Redis pipelining for maximum performance
    # This sends multiple XADD commands in a single network round-trip
    batch => true
    batch_events => 1000    # Higher batch size for better throughput
    batch_timeout => 2      # Lower timeout for better latency
    
    # Optional: Hash-based partitioning for load distribution
    enable_partitioning => true
    partition_strategy => "hash"
    partition_field => "source_host"
    partition_count => 16
    
    # Stream length management to prevent memory issues
    maxlen => 100000
    approximate_trimming => true
  }
}

# This configuration can handle very high throughput by:
# 1. Using Redis pipelining to reduce network round-trips
# 2. Large batch sizes to maximize pipeline efficiency
# 3. Partitioning to distribute load across multiple streams
# 4. Stream trimming to manage memory usage